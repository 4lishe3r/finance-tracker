name: finance_tracker
description: Personal Finance Tracker - Final Project
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  chopper: ^8.0.0
  http: ^1.2.0

  # Local DB
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.3

  # Lightweight prefs
  shared_preferences: ^2.2.3

  # Firebase (cloud)
  firebase_core: ^3.3.0
  cloud_firestore: ^5.3.0

  # Utils
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  chopper_generator: ^8.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true